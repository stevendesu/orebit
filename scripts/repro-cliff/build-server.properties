# Flat, deterministic world used ONLY to construct the cliff repro geometry via RCON, then frozen.
# Distinct level-name so it never touches run/world (the interactive world).
level-name=repro-cliff-build
level-type=minecraft\:flat
generate-structures=false
online-mode=false
white-list=false
max-players=4
motd=Orebit cliff-repro build
difficulty=peaceful
gamemode=creative
force-gamemode=false
view-distance=8
simulation-distance=6
spawn-protection=0
spawn-npcs=false
spawn-animals=false
spawn-monsters=false
max-tick-time=-1
pause-when-empty-seconds=-1
enable-rcon=true
rcon.password=orebit
rcon.port=25599
broadcast-rcon-to-ops=false
enable-status=false
snooper-enabled=false
allow-nether=false
sync-chunk-writes=true

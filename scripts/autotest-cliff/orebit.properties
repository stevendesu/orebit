# Orebit autotest bot capabilities — CLIFF INVALID-REGION-CROSSING REPRO (#5 invalidation-memory).
# Copied to run/autotest/config/orebit.properties by scripts/run-autotest-cliff.ps1.
#
# The scenario: a NO-CAPABILITY bot (cannot place, cannot break) on the -X low ground of a region-
# spanning cliff, goal on the +X cliff-top a full region away. The region tier emits a caps-
# UNCONDITIONAL walk-portal across the cliff (the low-side air is 6-connected over the lip to the
# high-side air, so the two fragments' footprints overlap on the shared +X face, floor-anchored to
# the true 8-block rise). The block tier CANNOT realize that rise: Pillar needs canPlace, Ascend-up-
# a-wall needs a placed footing, and digging needs canBreak — all off. So the hop returns BLOCKED,
# repairBlocked() blacklists the crossing, and (since the blacklist lives only in the current PathPlan
# instance) the pathology this scenario exists to demonstrate is exposed.

# --- capabilities: the crux — NO placing, NO breaking ---
placement.canPlace=false
mining.canMine=false

# --- survival: invulnerable, so the run is a PURE capability failure (no fall-death / hazard confound).
# (An immune bot's region-tier fall/rise damage penalty is zero; the cliff portal still exists, priced
#  at the bare 8*PILLAR_PER_BLOCK rise — a cost, never a blocker — exactly as intended.) ---
survival.takesDamage=false
survival.hunger=false
survival.needsBreath=false

# --- pathing: force SYNC search for run-to-run reproducibility (same pin as the main harness). ---
pathing.async=false

# --- deterministic drain for reproducible repros (same pins as scripts/autotest/orebit.properties):
# high, never-binding ms budgets so the FIXED count backstops (chunkBuildsPerTick + MAX_LEAVES_PER_TICK)
# govern -> identical per-tick drain counts across runs. ---
pathing.chunkBuildBudgetMs=100
pathing.chunkBuildsPerTick=8
pathing.hpaFlushBudgetMs=100

# Orebit swim-mine-course headless run (copied into run/swimmine/ by scripts/run-swimmine.ps1).
# A FLAT world: the SwimMineCourse harness builds a sealed bedrock water tank and a ladder shaft from real
# blocks at y=150, floating well above the superflat floor. The terrain itself is irrelevant — flat just
# keeps worldgen cheap and deterministic.
level-type=minecraft\:flat
level-name=world

# No real clients ever join; the bot is a server-side PlayerList member.
online-mode=false
white-list=false
max-players=4
motd=Orebit swim-mine course

# Peaceful: no mobs (a drowned in the tank would be a combat outcome, not a station-keeping one). It also
# keeps the per-tick break watch sound: nothing but the bot can ever remove a plug. No structures.
difficulty=peaceful
gamemode=survival
force-gamemode=false
generate-structures=false

# The course is a compact grid near spawn; 14 keeps the whole grid loaded + nav-built regardless of which
# tile the bot is teleported to.
view-distance=14
simulation-distance=10
spawn-protection=0

# Watchdog OFF: a slow first-gen tick must never hard-kill the server mid-run (the harness owns its budget).
max-tick-time=-1
# The empty-server tick pause must never engage (the bot joins within the first tick).
pause-when-empty-seconds=-1

# Irrelevant-but-quiet defaults
enable-rcon=false
enable-status=false
snooper-enabled=false
spawn-npcs=false
spawn-animals=false
allow-nether=false
sync-chunk-writes=false

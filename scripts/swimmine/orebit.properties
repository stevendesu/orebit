# Orebit swim-mine-course bot capabilities (copied to run/swimmine/config/orebit.properties by
# run-swimmine.ps1). The point of this run is to isolate the FOLLOWER's mining HOLD in a non-ground medium
# (SteerControl.stationKeep's fluid + climbable branches), so the config makes a break the only route:
#
#   * mining.canMine ON — unlike the gate/shaft/staircase courses. The break IS the test: the whole
#     pathology is that BotMining's reactive progress resets when the mover stops asking for the cell, and
#     the mover stops because the un-held bot sank out of the Traverse's admitted band.
#   * placement.canPlace OFF -> the bot cannot bridge/pillar out of the tank or across the wall; the
#     planned break is the ONLY route (every structural block on both tiles is BEDROCK, so "canMine" buys
#     the bot exactly the tile's designated stone cells and nothing else).
#   * survival.needsBreath OFF -> a submerged break is ~141 ticks PER CELL (vanilla divides destroy speed by
#     5 for an eye in water and by 5 again for !onGround), so ~282 ticks fully submerged. With breath on the
#     bot would drown mid-hold and the drowning, not the station-keeping, would decide the tile.
#   * survival.takesDamage ON -> physically faithful; a genuine fall out of the ladder shaft shows as the
#     distinct fell-out outcome rather than a silent survival.
#   * survival.hunger OFF -> irrelevant here; mirror the sibling courses.
#   * async OFF -> deterministic, reproducible search (the autotest/parkour/swim/ice/trapdoor/gate
#     rationale).
#
# doors.toggle is left at its default: no tile contains an openable.

survival.takesDamage=true
survival.hunger=false
survival.needsBreath=false

placement.canPlace=false
mining.canMine=true

pathing.async=false

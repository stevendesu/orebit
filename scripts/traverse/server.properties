# Orebit shaft-course headless run (copied into run/shaft/ by scripts/run-shaft.ps1).
# A FLAT world: the ShaftCourse harness builds floating stone slabs (each bored with one 1x1 ladder shaft
# and, on the hatch tiles, an equal-facing mouth trapdoor) from blocks at y=140..150, floating well above
# the superflat floor, so a fall off a slab edge is unambiguous. The terrain itself is irrelevant — flat
# just keeps worldgen cheap and deterministic.
level-type=minecraft\:flat
level-name=world

# No real clients ever join; the bot is a server-side PlayerList member.
online-mode=false
white-list=false
max-players=4
motd=Orebit shaft course

# Peaceful: no mobs to knock a bot off course (that would be a combat outcome, not a movement pathology).
# It also keeps the per-tick hatch state watch sound: nothing but the bot can ever change a mouth trapdoor
# (no redstone on any tile, and this course has no external-flip tile). No structures: the course is the
# only thing that matters.
difficulty=peaceful
gamemode=survival
force-gamemode=false
generate-structures=false

# The course is a compact grid near spawn; 14 keeps the whole grid loaded + nav-built regardless of which
# tile the bot is teleported to.
view-distance=14
simulation-distance=10
spawn-protection=0

# Watchdog OFF: a slow first-gen tick must never hard-kill the server mid-run (the harness owns its budget).
max-tick-time=-1
# The empty-server tick pause must never engage (the bot joins within the first tick).
pause-when-empty-seconds=-1

# Irrelevant-but-quiet defaults
enable-rcon=false
enable-status=false
snooper-enabled=false
spawn-npcs=false
spawn-animals=false
allow-nether=false
sync-chunk-writes=false

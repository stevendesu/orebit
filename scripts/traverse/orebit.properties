# Orebit TRAVERSE-COURSE config.
#
# MINING IS ON, and that is the whole point of this course existing separately.
# Every other movement course (parkour, ice, shaft, gate, staircase, replan, swim) runs
# mining.canMine=false so that geometry alone decides the route. That makes them structurally
# incapable of testing the break-then-enter contract: with mining off the planner treats a
# blocking block as a wall and simply routes around it, so a Traverse that must CLEAR its own
# body cells before entering them is never emitted at all.
#
# The 2026-08-25 long flagship failed exactly there: the planner emitted
#   Traverse d(0,0,1) ->(358,64,499) [brk=2 plc=0]
#   planned edits: BREAK(358,65,499) BREAK(358,66,499)
# through a bamboo stalk, the two breaks never executed, and the follower entered the cell
# anyway and wedged inside the stalk for ~47k ticks with no step FAILED ever emitted.
survival.takesDamage=true
survival.hunger=false
survival.needsBreath=false
placement.canPlace=false
mining.canMine=true
doors.toggle=true
pathing.async=false

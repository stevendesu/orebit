# Orebit boxed-in bot capabilities (copied to run/boxedin/config/orebit.properties by run-boxedin.ps1).
#
# The point of this run is to prove the multi-level PROACTIVE boxed-in scan gives up honestly on a goal
# sealed inside a solid pocket, and still reaches an ordinary open goal.
#
#   * mining OFF (canMine=false) -> REQUIRED for the seal to be provable. The region tier is unbreakable-BLIND
#     (it saturates bedrock's hardness sentinel to the same nibble as breakable obsidian and prices a finite
#     dig-through edge), so a BREAK-CAPABLE bot "digs out" of ANY tomb and no seal ever closes for it (the
#     residual deferred to #6, DESIGN-boxed-in-reachability.md §14). A no-break bot has no dig edges, so a
#     solid wall is a hard seal. The bot still CARRIES a diamond pickaxe (harness spec), but the caps forbid
#     breaking. Verified empirically: with canMine=true the tomb gives up REACTIVELY (boxedInProven=false),
#     not via the proactive seal.
#   * placement OFF -> no pillar/bridge escape to muddy the sealed verdict.
#   * takesDamage OFF -> the geometry never puts the bot in a fall/hazard situation; a give-up must be the
#     proactive boxed-in proof, never a death.
#   * async OFF -> deterministic, reproducible search (the autotest rationale).

survival.takesDamage=false
survival.hunger=false
survival.needsBreath=false

placement.canPlace=false
mining.canMine=false

pathing.async=false

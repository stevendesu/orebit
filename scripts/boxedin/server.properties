# Orebit boxed-in headless run (copied into run/boxedin/ by scripts/run-boxedin.ps1).
# A FLAT world: the BoxedInCourse harness builds a sealed bedrock tomb + an open stone platform from
# blocks at y=150, floating ~200 blocks above the superflat floor, so the harness never depends on the
# exact flat-preset surface Y. The terrain itself is irrelevant to the test — flat just keeps worldgen
# cheap and deterministic.
level-type=minecraft\:flat
level-name=world

# No real clients ever join; the bot is a server-side PlayerList member.
online-mode=false
white-list=false
max-players=4
motd=Orebit boxed-in course

# Peaceful: no mobs. No structures: the course is the only thing that matters and structures cost gen time.
difficulty=peaceful
gamemode=survival
force-gamemode=false
generate-structures=false

# The course is a compact cluster near spawn; 14 keeps the whole area loaded + nav-built (Gate 1: the goal's
# L0 region must be BUILT for the proactive boxed-in scan to run).
view-distance=14
simulation-distance=10
spawn-protection=0

# Watchdog OFF: a slow first-gen tick must never hard-kill the server mid-run (the harness owns its budget).
max-tick-time=-1
# The empty-server tick pause must never engage (the bot joins within the first tick).
pause-when-empty-seconds=-1

# Irrelevant-but-quiet defaults
enable-rcon=false
enable-status=false
snooper-enabled=false
spawn-npcs=false
spawn-animals=false
allow-nether=false
sync-chunk-writes=false

# Orebit shaft-course bot capabilities (copied to run/shaft/config/orebit.properties by run-shaft.ps1).
# The point of this run is to isolate the TRAPDOOR-LADDER CLIMB (the §3 mouth rules + the §4 SET_OPEN
# folds + the §5 climbableBelow top-out, DESIGN-trapdoor-ladder-climb.md), so the config makes the mouth
# the ONLY route:
#
#   * doors.toggle ON (the default, pinned explicitly — the §4 mouth folds ARE the arc under test): the
#     closed oak tiles must open the hatch themselves, exactly once; the iron control must refuse (a
#     closed iron trapdoor is never hand-toggleable).
#   * mining.canMine OFF -> the bot can neither mine the hatch out of the mouth nor dig a bypass shaft
#     through the slab; the climb through the mouth is the ONLY route, and the iron-closed refusal is
#     exact (genuinely NO route -> the honest give-up is the only correct outcome).
#   * placement OFF -> no pillaring out of the bore and no bridging; the ladder column is the only
#     vertical route.
#   * takesDamage ON -> the arrive-UNDAMAGED assertion is the climbed-vs-fell discriminator: a real climb
#     rides vanilla's -0.15/t clamp (damage-free), a 10-deep plummet costs real health.
#   * needsBreath OFF / hunger OFF -> irrelevant here; mirror the sibling courses.
#   * async OFF -> deterministic, reproducible search (the autotest/parkour/swim/ice/trapdoor/gate
#     rationale).

survival.takesDamage=true
survival.hunger=false
survival.needsBreath=false

placement.canPlace=false
mining.canMine=false

doors.toggle=true

pathing.async=false

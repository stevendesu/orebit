# Orebit replan-course bot capabilities (copied to run/replan/config/orebit.properties by
# run-replan.ps1). The point of this run is to isolate the SEAM-ANCHORED REPLAN adoption contract
# (DESIGN-replan-handoff.md §5/§9.2): the course seals a committed corridor mid-leg and asserts the
# forced re-search's result parks until the seam and installs anchored on the walked plan. The config
# keeps the corridors honest:
#
#   * mining.canMine OFF + placement.canPlace OFF -> the bot can neither dig through the seal nor
#     bridge/pillar around it; the built detour/U-turn is the ONLY route, so the forced re-search's
#     answer is deterministic (the ReplanCourse Javadoc's recommended config).
#   * doors.toggle irrelevant (no openables on the course); left at the default.
#   * takesDamage ON -> physically faithful; a genuine fall off a tile shows as the distinct fell-off
#     outcome, not a silent survival.
#   * needsBreath OFF / hunger OFF -> irrelevant here; mirror the sibling courses.
#   * pathing.async: BOTH modes are first-class for this course (§9.2 coverage = one run each).
#     The template pins the default TRUE (the async park/drain pump); run-replan.ps1 -Sync rewrites
#     this key to false for the deterministic single-thread schedule. The active mode is stamped into
#     the result file by the course itself.

survival.takesDamage=true
survival.hunger=false
survival.needsBreath=false

placement.canPlace=false
mining.canMine=false

pathing.async=true

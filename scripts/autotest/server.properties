# Orebit headless autotest — deterministic world (copied into run/autotest/ by scripts/run-autotest.ps1).
# The seed is the scenario contract: jungle-tree start (-3,125,-28) -> trial-chamber goal (201,-28,90).
level-seed=-6453171316297072906
level-type=minecraft\:normal
level-name=world

# No real clients ever join this server; the bot is a server-side PlayerList member.
online-mode=false
white-list=false
max-players=4
motd=Orebit autotest

# DECISION: peaceful isolates NAVIGATION from trial-chamber combat (mobs killing a takesDamage bot is
# not a movement pathology). Flip to `normal` for a combat-exposed variant of the run.
difficulty=peaceful
gamemode=survival
force-gamemode=false

# The bot's own player chunk tickets do the corridor loading (ChunkMap.skipPlayer skips spectators only);
# 12 keeps terrain + nav-grid builds comfortably ahead of a walking bot.
#
# DIAGNOSTIC (2026-08-12): raised 12 -> 16 to match the owner's manual client (render 16 / simulation 12),
# which is the measured reason the two runs planned different routes. At 12 (192 blocks) the INITIAL region
# plan of the flagship fixture carried 9/17 unbuilt L1 steps — their portals pinned at the y≈63 surface
# preference — and the bot climbed to y≈103 chasing them. At 16 (256 blocks) every step of that route,
# goal region included (228 blocks out), is inside the initial load radius.
#
# That "never triggers a macro re-derive" claim is now WRONG and is kept only so the correction is legible:
# the 2026-08-14 runs show re-derives firing and incorporating newly-built terrain correctly. What they also
# show is that it does not help — each re-derive relocates the descent to whatever is STILL unbuilt (rz=1 ->
# rz=0 within 92 seconds), because unbuilt descent is priced at 0.5x a lateral walk while a built descent
# pays the real mine model. The bot chases the horizon; the lever is pricing, not re-planning.
#
# Pair with -StartDelay >= 150: 33x33 = 1089 chunks at pathing.chunkBuildsPerTick=8 needs ~137 ticks to
# drain, so a shorter delay leaves the wider radius half-built and buys nothing.
#
# 2026-08-14: back to 16 with -StartDelay 200, now that the region tier no longer floods speculatively into
# unbuilt space (the unbuilt-SHELL bound) and re-derives when optimistic steps become real. Question this
# run answers: at the SAME radius the owner's manual client uses, does the headless bot reproduce the manual
# route (into the jungle cave near (74,88,127), then below y=60) or still run at y~112 deferring its descent?
view-distance=16
simulation-distance=10

# The bot digs/places along its route; spawn protection must never veto edits near worldspawn.
spawn-protection=0

# Watchdog OFF: a long sync search or a slow first-generation tick must abort the TEST (its own budget),
# never hard-kill the server mid-run.
max-tick-time=-1

# Defensive: the empty-server tick pause must never engage (the bot joins within the first tick, and it
# IS a PlayerList member; unknown key is ignored on versions that predate it).
pause-when-empty-seconds=-1

# Irrelevant-but-quiet defaults
enable-rcon=false
enable-status=false
snooper-enabled=false
spawn-npcs=true
spawn-animals=true
generate-structures=true
allow-nether=true
sync-chunk-writes=false

# Orebit bamboo-course bot capabilities (copied to run/bamboo/config/orebit.properties by run-bamboo.ps1).
# The point of this run is to isolate ONE question: does the bot actually EXECUTE a planned break on a
# block whose collision is narrower than its cell, or does it walk into that cell and hold forever?
# (The 2026-08-29 flagship wedge at (352,71,512) — the planner folded BREAK(352,71,512) BREAK(352,72,512),
# a region re-derive swapped the plan a tick later, and the stalk was never mined. It appears exactly once
# in a 124k-line log, because from then on the bot's own cell is the search START and a start cell is
# never a break target.)
#
#   * mining.canMine ON — this IS the capability under test. Unlike the gate course, the break is the
#     whole point: the stalk is the only route through a 1-wide boxed corridor, so a bot that will not
#     mine it cannot finish, and a bot that does mine it finishes trivially.
#   * placement OFF -> no bridging or pillaring around the post (owner's framing: mine capability but no
#     place capability). With the corridor stone-boxed 2-tall there is no over-the-top route either, so
#     the planned break is the ONLY route.
#   * bamboo is NOT protected by default (mining.protectedBlocks left ABSENT so the built-in list
#     applies, and #minecraft:bamboo_plantable_on / bamboo are not on it) — a refusal here would be a
#     genuine executor refusal, not a policy one.
#   * takesDamage ON -> physically faithful; a genuine fall off a tile shows as the distinct fell-off
#     outcome, not a silent survival.
#   * needsBreath OFF / hunger OFF -> irrelevant here; mirror the sibling courses.
#   * async OFF -> deterministic, reproducible search (the autotest/parkour/swim/ice/trapdoor/gate
#     rationale). This MATCHES the flagship, which also ran pathing.async=false (its log says
#     "seam-park: SYNC seeded"), so async is not a variable between the two.
#
# KNOWN LIMITATION OF THIS HARNESS (read before trusting a GREEN result). The wedge's proximate trigger
# was a region re-derive -- "REVEALED unbuilt->built on L3 skeleton (committed 1->2) -- re-deriving" ->
# "verdict=SWAPPED" -- which discarded the block plan that carried BREAK(352,71,512) one tick after it was
# created. That trigger needs a region to transition from UNBUILT to BUILT as chunks stream in. A small
# synthetic course has every region built before the goto is even issued, so the trigger CANNOT fire here.
# Consequently a GREEN result does NOT exonerate the break path: it means this tile reproduces the
# GEOMETRY but not the plan-swap, and the swap must then be induced deliberately (or the repro moved back
# to a long route over unbuilt terrain).

survival.takesDamage=true
survival.hunger=false
survival.needsBreath=false

placement.canPlace=false
mining.canMine=true

pathing.async=false

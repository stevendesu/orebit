# Orebit gate-course bot capabilities (copied to run/gate/config/orebit.properties by run-gate.ps1).
# The point of this run is to isolate FENCE-GATE OPERATION (the face-agnostic SET_OPEN fold + the
# PhaseRunner openable pre-pass, DESIGN-fence-gates.md §3/§4), so the config makes the toggle the ONLY
# route:
#
#   * doors.toggle ON (the default, pinned explicitly — it IS the arc under test): gates ride the
#     ratified single door-family key. The toggleoff tile flips this to false AT RUNTIME through the
#     real /bot config reload path (the course rewrites this live file + ConfigLoader.reload), which is
#     why that tile runs LAST — the flip is never reverted.
#   * mining.canMine OFF — deliberately UNLIKE the trapdoor course (which needed MineDown's toggle arm):
#     no gate tile has a MineDown arm (§8 defers the vertical gate folds), and no-break makes the
#     toggleoff refusal exact — the gate is default-PROTECTED (#minecraft:fence_gates is in the built-in
#     mining.protectedBlocks list, left ABSENT here so the default applies) and the corridor stone can't
#     be dug around either, so with the toggle off there is genuinely NO route and the honest give-up is
#     the only correct outcome.
#   * placement OFF -> the bot cannot bridge/pillar around a tile; the planned toggle route is the ONLY
#     route.
#   * takesDamage ON -> physically faithful; a genuine fall off a tile shows as the distinct fell-off
#     outcome, not a silent survival.
#   * needsBreath OFF / hunger OFF -> irrelevant here; mirror the sibling courses.
#   * async OFF -> deterministic, reproducible search (the autotest/parkour/swim/ice/trapdoor rationale).

survival.takesDamage=true
survival.hunger=false
survival.needsBreath=false

placement.canPlace=false
mining.canMine=false

doors.toggle=true

pathing.async=false

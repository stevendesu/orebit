# Orebit CAVE-IN-course bot capabilities (copy to run/replan/config/orebit.properties before
# launching `:fabric:<ver>:runReplan -Porebit.cavein=<supported|suspended>`).
#
# CaveInCourse rides the `replan` run config (same run dir), but it must NOT inherit
# scripts/replan/orebit.properties: that file pins mining.canMine=false + placement.canPlace=false to
# isolate the replan-adoption contract. A bot with no mining rights cannot undermine anything, so the
# SUPPORTED variant would report "PASS refused the climb" for entirely the wrong reason and prove
# nothing about the RISKS_GRAVITY fold gate. The whole premise of this harness is a bot that IS
# allowed to break and place and still declines, because every candidate edit is the support of a
# gravity block.
#
#   * mining.canMine ON + placement.canPlace ON -> the gate is the only thing standing between the bot
#     and the ceiling. A burial is then a real gate failure, not a config artefact.
#   * takesDamage ON -> the suffocation the flagship actually died of stays reachable.
#   * needsBreath OFF / hunger OFF -> irrelevant to the hazard; mirror the sibling courses.
#   * pathing.async TRUE -> the default the flagship ran under.

survival.takesDamage=true
survival.hunger=false
survival.needsBreath=false

placement.canPlace=true
mining.canMine=true

pathing.async=true

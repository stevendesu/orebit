# Orebit staircase-course bot capabilities (copied to run/staircase/config/orebit.properties by
# run-staircase.ps1). The point of this run is to isolate ITERATED ASCEND -- consecutive one-block rises
# executed back to back -- so the config makes the staircase the ONLY route:
#
#   * mining.canMine OFF -> the bot cannot tunnel through the staircase or cut the corner off a tread.
#   * placement.canPlace OFF -> the bot cannot pillar or bridge past the shape under test. Without both of
#     these a "pass" could be the bot building its own ramp and never running a single Ascend, which would
#     make the whole course silently vacuous.
#   * takesDamage ON -> physically faithful; a genuine fall off a tile shows as the distinct fell-off
#     outcome, not a silent survival. (Fall damage also keeps the 2026-08-10 apex-inclusive parkour pricing
#     honest, though no tile here offers a parkour route.)
#   * needsBreath OFF / hunger OFF -> irrelevant here; mirror the sibling courses.
#   * async OFF -> deterministic, reproducible search. The two field captures of this wedge produced two
#     DIFFERENT plans, and while that turned out to be a differing goal rather than async, a movement
#     pathology must be chased on a fixed plan.

survival.takesDamage=true
survival.hunger=false
survival.needsBreath=false

placement.canPlace=false
mining.canMine=false

pathing.async=false

# Orebit trapdoor-course bot capabilities (copied to run/trapdoor/config/orebit.properties by
# run-trapdoor.ps1). The point of this run is to isolate TRAPDOOR OPERATION (the SET folds + the
# PhaseRunner openable pre-pass), so the config makes the toggle the only sane route:
#
#   * doors.toggle ON (the default, pinned explicitly — it IS the arc under test): trapdoors ride the
#     ratified single door-family key.
#   * mining.canMine ON — REQUIRED: MineDown's §5 hatch-drop toggle arm sits behind the movement's
#     canBreak top gate (a walk-only bot never runs MineDown at all, hatch or not). The trapdoors
#     themselves stay unminable: mining.protectedBlocks is left ABSENT so the built-in DEFAULT list
#     applies (it protects all trapdoors from BREAKING; the toggle path bypasses PROTECTED by design),
#     and a barehanded stone break (~160 ticks) never outbids a 6-cost toggle, so the corridor fabric
#     needs no protection to keep the routes honest.
#   * placement OFF -> the bot cannot bridge over the closeparkour gap or pillar out of a shaft; the
#     planned toggle route is the ONLY route.
#   * takesDamage ON -> physically faithful (the drops here are all sub-lethal); a genuine fall off a
#     tile shows as the distinct fell-off outcome, not a silent survival.
#   * needsBreath OFF / hunger OFF -> irrelevant here; mirror the sibling courses (sprint always
#     available for the closeparkour sprint jump).
#   * async OFF -> deterministic, reproducible search (the autotest/parkour/swim/ice rationale).

survival.takesDamage=true
survival.hunger=false
survival.needsBreath=false

placement.canPlace=false
mining.canMine=true

doors.toggle=true

pathing.async=false

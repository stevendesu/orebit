# Orebit autotest bot capabilities — LATERAL-CLIMB repro.
# Copied to run/autotest/config/orebit.properties by scripts/run-autotest-climb.ps1.
#
# The scenario: a NO-CAPABILITY bot (cannot place, cannot break) must cross a 5-block floor gap by
# clinging to a single feet-level row of VINES on a wall face and easing SIDEWAYS across it (lateral
# Climb, Δy == 0). Placing (bridge) and breaking (dig) are OFF, and the gap is too wide to parkour, so
# the ONLY realizable crossing is the lateral cling. Over the gap there is no standable ground beneath
# the vine cells, so Climb's standability guard does NOT suppress the lateral grab (the recent vine fix
# only suppresses it where a plain Traverse/Descend reaches ground under the vine — not the case here).

# --- capabilities: the crux — NO placing, NO breaking (forces the vine cling, not a bridge/dig) ---
placement.canPlace=false
mining.canMine=false

# --- survival: invulnerable, so a mis-cross that falls into the gap is a clean routing/follower signal,
# never a fall-death confound. ---
survival.takesDamage=false
survival.hunger=false
survival.needsBreath=false

# --- pathing: force SYNC search for run-to-run reproducibility (same pin as the main harness). ---
pathing.async=false

# --- deterministic drain for reproducible repros (same pins as scripts/autotest/orebit.properties):
# high, never-binding ms budgets so the FIXED count backstops (chunkBuildsPerTick + MAX_LEAVES_PER_TICK)
# govern -> identical per-tick drain counts across runs. ---
pathing.chunkBuildBudgetMs=100
pathing.chunkBuildsPerTick=8
pathing.hpaFlushBudgetMs=100

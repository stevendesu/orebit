# Orebit CLIMB repro server props — used ONLY with -MasterWorld (frozen flat lateral-climb world).
# The master's level.dat already carries the flat generator settings, so this seed/level-type is
# IGNORED for the existing copied world (level.dat wins); it only governs any chunk generated OUTSIDE
# the master's saved corridor (deterministic flat regen — no vegetation). level-name=world matches the
# copied dir.
level-seed=0
level-type=minecraft\:flat
level-name=world

online-mode=false
white-list=false
max-players=4
motd=Orebit climb repro
difficulty=peaceful
gamemode=survival
force-gamemode=false

# The bot's own player chunk tickets load the corridor; 12/10 keeps terrain + nav-grid ahead of it.
view-distance=12
simulation-distance=10
spawn-protection=0

# Watchdog OFF: a long sync search must abort the TEST (its own budget), never hard-kill the server.
max-tick-time=-1
pause-when-empty-seconds=-1

enable-rcon=false
enable-status=false
snooper-enabled=false
spawn-npcs=false
spawn-animals=false
spawn-monsters=false
generate-structures=false
allow-nether=false
sync-chunk-writes=false
